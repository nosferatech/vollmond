name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push cancels the older run of a pull request, but every run on main completes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The TypeScript workspace in js/. A later `python` job sits beside this one.
  js:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The exact release, so its Unicode data is known: the Unicode tables' comparison needs Unicode 17.0 (Node 24.21.0
          # bundles ICU 78.3). Raise it deliberately, with the tables if its Unicode version changes.
          node-version-file: js/.node-version
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
        env:
          # Fails the comparison of the Unicode tables with the runtime instead of skipping it when the versions differ.
          VMD_REQUIRE_UNICODE_COMPARISON: "1"
      # The read commands run over the suite's store of Appendix A, as built, with the parsers loaded as they are in a release.
      - name: Smoke test the built command
        # An explicit bash runs with -eo pipefail, so a command that fails before its grep fails the step.
        shell: bash
        env:
          # ls, outline, check, index and refs write the local index; it goes to a directory of this run, never to ~/.cache, and no step restores
          # a vmd cache, since a gate that trusted an earlier run's entries would trust what that run read.
          XDG_CACHE_HOME: ${{ runner.temp }}/vmd-cache
        run: |
          node packages/cli/dist/main.js --version
          store=../conformance/cases/addresses/appendix-a
          ticket=tickets/0171-clean-root-in-scattered-record.md
          node packages/cli/dist/main.js --store "$store" ls | grep -q "^$ticket "
          # ls wrote its entries to the run's cache directory.
          compgen -G "$XDG_CACHE_HOME/vmd/v1-*/entries/parse/*/*.jsonl" > /dev/null
          node packages/cli/dist/main.js --store "$store" outline "$ticket" | grep -q '^  #done '
          node packages/cli/dist/main.js --store "$store" --json get "$ticket#done" --meta all | grep -q '"@address":"#done"'
          node packages/cli/dist/main.js --store "$store" grep -F 'clean root' | grep -q "^$ticket:"
          node packages/cli/dist/main.js --store "$store" check | grep -q '^1 record (1 from the index), 0 references: 0 errors, 0 warnings$'
          node packages/cli/dist/main.js --store "$store" index | grep -q '^1 record (0 parsed, 1 from the index), 0 references; cache '
          # The decision records, a store of some 300 records that link to each other: check finds no issue.
          node packages/cli/dist/main.js --store ../docs/decisions check | grep -q ': 0 errors, 0 warnings$'
          node packages/cli/dist/main.js --store ../docs/decisions refs U4.md | grep -q '^U4\.md  [0-9,]* references\?$'
      # The decision records are a vmd store: every record must read with no issue, and its supersessions and links must hold.
      - name: Read the decision records
        run: node scripts/check-decisions.mjs
      # And every record must be valid against the collection's schema, keyed sections included.
      - name: Validate the decision records
        run: node scripts/validate-decisions.mjs
      # Any case that fails or is in error fails the job. The report is uploaded either way, to show which, unless the run was
      # cancelled.
      - name: Run the conformance suite
        run: npm run conformance
      - name: Upload the conformance report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-report
          path: js/conformance-report.json
          if-no-files-found: ignore

  # The status check that the ruleset on main requires. It is the only job named `check`. It has no path filter and
  # runs on every pull request, so it always reports, and it succeeds only when every job in `needs` succeeded. To add a
  # language, add its job above and list it in `needs` and in the step below; do not rename this job.
  check:
    needs: [js]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          JS_RESULT: ${{ needs.js.result }}
        run: |
          echo "js: $JS_RESULT"
          test "$JS_RESULT" = success
