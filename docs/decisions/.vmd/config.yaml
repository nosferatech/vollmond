# The decisions of the vollmond project, one record per decision (AGENTS.md). Each record is named by its decision id, and the
# decision log, docs/draft/vollmond-proposal-review.md, indexes them by round.
vmd: 1
collections:
  decisions:
    match: ["*.md"]
    schema: decision.schema.yaml
    filename: "^[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?\\.md$"
    key: { filename: "^(.+)\\.md$" }
