[package]
name = "serde-json-check"
version = "0.0.0"
edition = "2021"
publish = false

[features]
# Run with `--features arbitrary` to measure serde_json's arbitrary_precision feature.
arbitrary = ["serde_json/arbitrary_precision"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["raw_value"] }
