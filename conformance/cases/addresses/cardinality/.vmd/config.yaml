vmd: 1
collections:
  journal:
    match: ["journal/*.md"]
    schema: journal.schema.yaml
  runs:
    match: ["perf/runs/*.yaml"]
    schema: run.schema.yaml
  repeating:
    match: ["repeating/*.md"]
    schema: repeating.schema.yaml
  mapped:
    match: ["mapped/*.json"]
    schema: mapped.schema.yaml
